name: build DeltaDotNet

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ client
  windows:
    name: Client + Theme Studio (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore client/DeltaDotNet.Client/DeltaDotNet.Client.csproj
          dotnet restore client/DeltaDotNet.ThemeStudio/DeltaDotNet.ThemeStudio.csproj

      - name: Publish the client
        run: >
          dotnet publish client/DeltaDotNet.Client/DeltaDotNet.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/client

      - name: Publish Theme Studio
        run: >
          dotnet publish client/DeltaDotNet.ThemeStudio/DeltaDotNet.ThemeStudio.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/themestudio

      - name: Upload the client
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDotNet-client-win-x64
          path: publish/client

      - name: Upload Theme Studio
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDotNet-themestudio-win-x64
          path: publish/themestudio

      - name: Zip for the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/client/*      -DestinationPath DeltaDotNet-client-win-x64.zip
          Compress-Archive -Path publish/themestudio/* -DestinationPath DeltaDotNet-themestudio-win-x64.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeltaDotNet-client-win-x64.zip
            DeltaDotNet-themestudio-win-x64.zip

  # ------------------------------------------------------------------ server
  server:
    name: Server (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: server
        run: |
          for f in src/*.js; do node --check "$f"; done

      - name: Smoke test (start and ping /api/health)
        working-directory: server
        env:
          DDN_SECRET: ci-secret
          PORT: 8080
        run: |
          node src/index.js &
          pid=$!
          sleep 3
          curl -sf http://127.0.0.1:8080/api/health
          kill $pid

      - name: Pack the server
        run: |
          mkdir -p out
          cp -r server out/server
          rm -rf out/server/node_modules out/server/data

      - name: Upload the server
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDotNet-server
          path: out/server

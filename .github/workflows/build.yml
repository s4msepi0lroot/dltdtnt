name: Build DeltaDotNet

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # C# client + theme studio (WPF -> Windows only)
  # ---------------------------------------------------------------
  windows-apps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DeltaDotNet.sln

      - name: Build
        run: dotnet build DeltaDotNet.sln -c Release --no-restore

      - name: Publish client (self-contained, single file)
        run: >
          dotnet publish src/DeltaDotNet.Client/DeltaDotNet.Client.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/client

      - name: Publish theme studio (self-contained, single file)
        run: >
          dotnet publish src/DeltaDotNet.ThemeStudio/DeltaDotNet.ThemeStudio.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/themestudio

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDotNet-Client-win-x64
          path: publish/client

      - name: Upload theme studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDotNet-ThemeStudio-win-x64
          path: publish/themestudio

  # ---------------------------------------------------------------
  # Node.js server: install, syntax check, package
  # ---------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Syntax check
        run: |
          for file in src/*.js; do node --check "$file"; done

      - name: Smoke test (boot the server and hit /health)
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sSf http://127.0.0.1:8080/health
          kill $SERVER_PID
        env:
          PORT: 8080

      - name: Package server
        run: |
          cd ..
          zip -r DeltaDotNet-Server.zip server -x 'server/node_modules/*' 'server/data/*'

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeltaDotNet-Server
          path: DeltaDotNet-Server.zip

  # ---------------------------------------------------------------
  # Attach everything to a GitHub Release when you push a tag
  # ---------------------------------------------------------------
  release:
    needs: [ windows-apps, server ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip artifacts
        run: |
          cd artifacts
          for dir in */; do (cd "$dir" && zip -r "../${dir%/}.zip" .); done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip

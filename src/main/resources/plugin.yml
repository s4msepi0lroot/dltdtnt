name: SepiolEconomy
version: '${version}'
main: ru.sepiolsmp.economy.SepiolEconomy
api-version: '1.21'
authors: [sepiolSMP]
description: "Экономика сезона sepiolSMP: банк с плавающим курсом, кошельки, переводы с комиссией"
softdepend: [Vault, VaultUnlocked, SepiolCore, SepiolSkins, LuckPerms, AuthMe]
commands:
  balance:
    description: "Баланс игрока"
    aliases: [bal, money]
    usage: "/balance [ник]"
  pay:
    description: "Перевод другому игроку"
    usage: "/pay <ник> <сумма>"
  bank:
    description: "Банк сезона: курс и сдача ресурсов"
    aliases: [course, kurs]
    usage: "/bank [quote|sell|list|info|top]"
  seco:
    description: "Админ-команды экономики"
    aliases: [sepioleconomy]
    usage: "/seco <give|take|set|treasury|market|reload|info>"
permissions:
  sepioleconomy.use:
    description: "Базовый доступ к экономике"
    default: true
  sepioleconomy.balance.other:
    description: "Смотреть баланс других игроков"
    default: op
  sepioleconomy.pay:
    description: "Переводы другим игрокам"
    default: true
  sepioleconomy.bank:
    description: "Сдача ресурсов в банк сезона"
    default: true
  sepioleconomy.admin:
    description: "Управление экономикой"
    default: op

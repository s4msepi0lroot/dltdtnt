name: SepiolCore
version: '${version}'
main: ru.sepiolsmp.core.SepiolCore
api-version: '1.21'
authors: [s4fmer, NotionAI]
description: sepiolSMP season 2 core. Brick 1 - self-hosted web profiles (Dynmap-style port) with Bad Habits and BoozeCraft integration.
folia-supported: false

commands:
  sepiol:
    description: SepiolCore admin commands
    usage: /sepiol <reload|web|profile [nick]>
    permission: sepiolcore.admin

permissions:
  sepiolcore.admin:
    description: Manage SepiolCore
    default: op
  sepiolcore.profile:
    description: Use /sepiol profile
    default: true

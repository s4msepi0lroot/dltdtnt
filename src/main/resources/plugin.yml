name: SepiolSkins
version: 0.1.0
main: ru.sepiolsmp.skins.SepiolSkins
api-version: '1.21'
author: sepiolSMP
description: Universal skins for licensed and cracked players (Mojang -> Ely.by -> MineSkin) + local avatars for the web profile
softdepend:
  - AuthMe
  - SkinsRestorer
  - SepiolCore
commands:
  skin:
    description: Skin management
    usage: /skin help
    aliases:
      - sskin
      - skins
permissions:
  sepiolskins.use:
    description: Use /skin for yourself
    default: true
  sepiolskins.other:
    description: Manage skins of other players
    default: op
  sepiolskins.admin:
    description: Reload, purge cache, force refresh
    default: op

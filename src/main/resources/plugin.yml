name: SepiolFinale
version: '${version}'
main: ru.sepiolsmp.finale.SepiolFinale
api-version: '1.21'
authors: [sepiolSMP]
description: Upravlyaemyy final sezona - 5 faz, unichtozhenie mira i avtomaticheskoe vyklyuchenie servera.
softdepend: [SepiolCore, AuthMe, LuckPerms]

commands:
  finale:
    description: Upravlenie finalom sezona.
    usage: /finale help
    aliases: [sepiolfinale, konec]

permissions:
  sepiolfinale.admin:
    description: Polnyy dostup k komandam finala.
    default: op

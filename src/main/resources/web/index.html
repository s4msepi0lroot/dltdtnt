<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sepiolSMP — профили игроков</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
	<div class="brand">
		<span class="logo">⛏</span>
		<div>
			<h1>sepiolSMP</h1>
			<p id="season-line">загрузка…</p>
		</div>
	</div>
	<div class="status">
		<div class="pill"><b id="online">-</b><span>онлайн</span></div>
		<div class="pill"><b id="tps">-</b><span>TPS</span></div>
		<div class="pill"><b id="border">-</b><span>граница</span></div>
	</div>
</header>

<main>
	<section class="panel search-panel">
		<form id="search-form" autocomplete="off">
			<input id="search" type="text" placeholder="Ник игрока…" spellcheck="false">
			<button type="submit">Найти</button>
		</form>
		<p class="hint">Ссылка на профиль: <code>?player=Ник</code> — её же выдаёт <code>/sepiol profile</code> в игре.</p>
	</section>

	<section class="panel" id="profile-panel" hidden>
		<div class="profile-head">
			<img id="avatar" alt="" width="72" height="72">
			<div>
				<h2 id="profile-name">—</h2>
				<p id="profile-sub" class="hint">—</p>
			</div>
			<button id="close-profile" type="button" class="ghost">✕</button>
		</div>
		<div class="cards" id="profile-cards"></div>
	</section>

	<section class="panel">
		<h3>Сейчас на сервере</h3>
		<div id="online-list" class="chips"><span class="hint">загрузка…</span></div>
	</section>

	<section class="panel">
		<h3>Топ сезона по наигранному</h3>
		<table id="top-table">
			<thead>
				<tr><th>#</th><th>Игрок</th><th>Часы</th><th>Смерти</th><th>Киллы мобов</th><th>PvP</th></tr>
			</thead>
			<tbody></tbody>
		</table>
	</section>
</main>

<footer>
	<span>SepiolCore 0.1.0 — веб-профили раздаёт сам игровой сервер</span>
	<span id="mods-line"></span>
</footer>

<script src="/app.js"></script>
</body>
</html>

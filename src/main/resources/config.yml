# ============================================================
#  SepiolEconomy 0.1.1 — экономика сезона sepiolSMP
#  Деньги появляются в мире ТОЛЬКО через банк сезона.
#  Никакого админ-шопа: банк покупает ресурсы, но ничего не продаёт.
# ============================================================

economy:
  currency:
    singular: "сепиол"
    few: "сепиола"
    many: "сепиолов"
  # Стартовый капитал при первом входе на сервер
  starting-balance: 20.0
  # Потолок на счёте (защита от переполнения и дюпа)
  max-balance: 10000000.0
  decimals: 2

pay:
  enabled: true
  # Комиссия за перевод, % от суммы
  fee-percent: 5.0
  # Минимальная комиссия в сепиолах
  min-fee: 0.05
  # Минимальная сумма перевода
  min-amount: 1.0
  # Куда уходит комиссия: treasury (казна сезона) или burn (сгорает)
  fee-destination: treasury
  cooldown-seconds: 3
  # true — переводить можно только игрокам онлайн
  require-online: false

bank:
  enabled: true
  sell-cooldown-seconds: 1
  # Не принимать предметы с именем, лором, зачарованиями или NBT-тегами
  # (защита от сдачи реликвий, контрабанды и именных предметов)
  reject-custom-items: true
  reject-damaged-tools: true
  emission:
    # Сколько сепиолов сервер готов напечатать за сутки
    daily-cap: 5000.0
    # Всё, что сверх лимита, банк платит с этим множителем
    over-cap-factor: 0.5
    # Час (0-23) по времени сервера, когда лимит обнуляется
    reset-hour: 4
  price:
    # Ниже этой доли базовой цены курс не падает
    min-factor: 0.2
    # Бонус за «свежий товар»: рынок давно не видел этот ресурс
    fresh-bonus: 1.1
    # За сколько часов насыщение рынка спадает вдвое
    saturation-half-life-hours: 24
    # Общий множитель квот: >1 — рынок ёмче, цены падают медленнее
    quota-multiplier: 1.0
  gui:
    enabled: true
    title: "&8Банк сезона"

storage:
  save-interval-seconds: 120
  # Журнал всех транзакций (plugins/SepiolEconomy/ledger/ГГГГ-ММ-ДД.jsonl)
  ledger: true
  ledger-dir: "ledger"

web:
  # Выгрузка для веб-профиля SepiolCore
  export: true
  file: "web/economy.json"
  interval-seconds: 60
  top-size: 25

integration:
  # Мост Vault: любые сторонние плагины (лавки, аукцион) увидят наши сепиолы
  vault: true
  vault-priority: Highest


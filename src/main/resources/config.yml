# ============================================================
#  SepiolCore - sepiolSMP Season 2
#  Brick 1: web profiles served by the game server itself.
#  Works exactly like Dynmap: own port, no external hosting.
# ============================================================

season:
  name: "Season II"
  # ISO date, used by the web page to show "day N of the season"
  start: "2026-09-01"
  # planned end, purely informational
  end: "2026-10-31"
  world-border: 12000

web:
  enabled: true
  # Dedicated port behind your domain, e.g. https://sepiolsmp.ru:8300 or a reverse proxy to /profile
  port: 8300
  # 0.0.0.0 = listen on all interfaces. Use 127.0.0.1 if nginx proxies it.
  bind: "0.0.0.0"
  # Public base URL, shown in chat by /sepiol profile
  public-url: "http://localhost:8300"
  # Threads for the embedded HTTP server
  threads: 2
  # Seconds a built profile is cached before it is rebuilt from disk
  cache-seconds: 15
  # Show coordinates of online players on the web page (usually a bad idea on a PvP season)
  expose-coordinates: false
  # Extra HTTP header for reverse proxy setups
  cors-allow-origin: "*"
  # Folder with player heads rendered by SepiolSkins (brick 2), served as /avatar/<nick>.
  # "auto" = plugins/SepiolSkins/web/heads. No external avatar service is used.
  avatar-dir: "auto"

integration:
  # Auto = take the folder of the first loaded world. Override only if your layout is unusual.
  level-root: "auto"
  badhabits:
    enabled: true
    file: "badhabits/addiction.json"
    # addiction meter maximum used for the progress bars (BhConfig addictionMax)
    addiction-max: 100.0
  boozecraft:
    enabled: true
    file: "boozecraft_players.json"
    alcohol-cap: 100.0
    addiction-max: 100.0

leaderboards:
  # how many players the web index shows
  size: 25

# ============================================================
#  SepiolBlackMarket 0.1.0 - чёрный рынок сезона sepiolSMP
#  Деньги берутся из SepiolEconomy (или любой Vault-экономики).
#  Логика: раз в сутки в случайной точке мира встаёт торговец.
#  Координаты - товар. Спустя reveal-after-hours адрес сливается всем.
# ============================================================

economy:
  # auto | sepiol | vault | none
  mode: auto
  decimals: 2
  currency:
    singular: "сепиол"
    few: "сепиола"
    many: "сепиолов"

trader:
  enabled: true
  # "auto" = первый мир сервера
  world: "auto"
  # радиус появления от центра мира (граница сезона 12000 = +-6000)
  radius: 5200
  # не ближе чем так к спавну
  min-distance: 900
  # как часто приезжает
  interval-hours: 24
  # сколько стоит на одном месте
  stay-hours: 20
  # первый завоз после старта сервера
  first-delay-minutes: 15
  # через сколько часов координаты станут публичными (0 = никогда)
  reveal-after-hours: 6
  # цена адреса
  coords-price: 150.0
  # на каком расстоянии открывается витрина
  interaction-radius: 6.0
  # true = можно торговать из любой точки мира (выключено: надо идти)
  remote-shop: false
  announce-arrival: true
  announce-departure: true
  announce-reveal: true
  name: "&5Барыга &8| &7чёрный рынок"
  # сущность-носитель (WANDERING_TRADER, VILLAGER, ZOMBIE_VILLAGER, ...)
  entity: WANDERING_TRADER
  # новый завоз товара при каждом приезде
  restock-on-arrival: true
  # точка только на твёрдом блоке, без воды и лавы
  safe-blocks-only: true
  # атмосфера рядом с телегой
  effects: true
  particle: WITCH
  sound-open: "entity.wandering_trader.yes"
  sound-buy: "entity.experience_orb.pickup"
  sound-deny: "entity.villager.no"

prices:
  # на сколько процентов растёт цена лота за каждую покупку
  step-percent: 6.0
  # потолок цены (x от базы)
  max-factor: 4.0
  # спрос остывает вдвое за столько часов
  half-life-hours: 24
  # при завозе спрос умножается на это
  restock-cooldown: 0.5
  # задержка между покупками, секунд
  buy-cooldown-seconds: 2

wanted:
  enabled: true
  # базовый срок розыска
  minutes: 30
  # плюс за каждый предмет контрабанды при досмотре
  per-item-minutes: 2
  max-minutes: 180
  # розыск виден всем: светящийся силуэт
  glow: true
  announce: true
  # true = о розыске знает только стафф
  staff-only-announce: false
  # смерть не снимает розыск
  keep-on-death: true

scan:
  # автоматический досмотр в зонах досмотра
  enabled: true
  interval-seconds: 20
  # зона вокруг спавна мира
  use-world-spawn: true
  radius: 120
  # дополнительные зоны: "мир:x:z:радиус"
  zones: []
  auto-wanted: true
  # тащить контрабанду сразу при автодосмотре (грубо, по умолчанию нет)
  confiscate: false
  notify-staff: true
  # кого не трогать
  bypass-permission: "sepiolblackmarket.staff"

raid:
  # /bm raid <ник>
  confiscate: true
  wanted-minutes: 45
  announce: true

storage:
  save-interval-seconds: 120
  # журнал сделок: deals/<дата>.jsonl
  deals: true
  deals-dir: "deals"

web:
  export: true
  file: "web/blackmarket.json"
  interval-seconds: 60
  # НИКОГДА не включай на публичном профиле: слив координат
  expose-coordinates: false
  wanted-list: true

# Что считается контрабандой при досмотре и конфискации.
# Маска * работает в конце идентификатора. Кроме этого всё, что куплено
# на рынке с флагом contraband, помечается скрытой меткой и тоже ловится.
contraband:
  - "badhabits:cig_*"
  - "badhabits:pill_*"
  - "badhabits:serum_*"
  - "badhabits:void_dust"
  - "badhabits:dream_joint"
  - "badhabits:crystal_base"
  - "badhabits:raw_batch"
  - "badhabits:chem_reagent"
  - "badhabits:syringe"
  - "badhabits:synth_lab"
  - "badhabits:elixir_titan"
  - "boozecraft:moonshine"
  - "boozecraft:everclear"
  - "boozecraft:absinthe"
  - "boozecraft:dragon_absinthe"
  - "boozecraft:dirty_swill"
  - "boozecraft:still"


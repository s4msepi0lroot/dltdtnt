stages:
  - test 
  - build
  - release

test:
  stage: test
  rules:
    - when: never
  script:
    - echo "disabled"

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip curl
    - bash ci/restore-libraries.sh
  script:
    - dotnet build -c Release
    - echo "VERSION=$(grep -m1 'Version = ' Plugin.cs | sed 's/.*"\(.*\)".*/\1/')" >> build.env
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - bin/Release/ScavPrototypeSexMod.dll

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - |
      set -e
      [ "$VERSION" = "0.0.0" ] && exit 0
      git fetch --tags
      git rev-parse "v$VERSION" >/dev/null 2>&1 && exit 0
      release-cli create \
        --name "Release v$VERSION" \
        --tag-name "v$VERSION" \
        --ref "$CI_COMMIT_SHA" \
        --assets-link "{\"name\":\"ScavPrototypeSexMod-v$VERSION.dll\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/bin/Release/ScavPrototypeSexMod.dll?job=build\"}"
